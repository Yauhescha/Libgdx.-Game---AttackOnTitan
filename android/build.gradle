plugins { id 'com.android.application' }

configurations { natives }

android {
    namespace 'com.hescha.aot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hescha.game'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.2.3'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.setSrcDirs(['src/main/java'])
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ["$buildDir/generated/jniLibs"]
        }
    }

    packaging { jniLibs { useLegacyPackaging = false } }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.14.2'
    natives 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-arm64-v8a'
}

tasks.register('copyAndroidNatives') {
    doLast {
        def target = layout.buildDirectory.dir('generated/jniLibs').get().asFile
        delete target
        target.mkdirs()
        configurations.natives.files.each { jar ->
            def abi = jar.name.contains('armeabi-v7a') ? 'armeabi-v7a' : jar.name.contains('arm64-v8a') ? 'arm64-v8a' : null
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    include '**/*.so'
                    into new File(target, abi)
                    eachFile { it.path = it.name }
                    includeEmptyDirs = false
                }
            }
        }
    }
}
preBuild.dependsOn copyAndroidNatives
